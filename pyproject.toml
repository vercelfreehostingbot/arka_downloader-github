[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arka-downloader"
version = "5.3.0"
description = "Production-ready Telegram downloader bot"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.13,<4",
  "yt-dlp>=2024.10",
  "gallery-dl>=1.27",
  "curl-cffi>=0.7",
  "aiohttp>=3.10",
  "aiofiles>=24.1",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "Pillow>=10",
]

[tool.setuptools]
packages = {find = {include = ["app*"]}}

[tool.ruff]
line-length = 100
exclude = ["data", "downloads", "logs", "backups", "updates"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires external services such as PostgreSQL or Redis",
  "e2e: end-to-end tests",
]
